name: Import PlantMind modular app

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: plantmind-modular-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until all archive parts are present
        id: ready
        shell: bash
        run: |
          files=(
            src/App.tsx
            src/main.tsx
            src/index.css
            package.json
            vite.config.ts
            .github/workflows/deploy-pages.yml
          )
          for i in "${!files[@]}"; do
            expected="PMZIP-PART-$((i + 1))"
            actual="$(head -n 1 "${files[$i]}" 2>/dev/null || true)"
            if [ "$actual" != "$expected" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Archive part $((i + 1)) is not ready yet."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reconstruct and import the modular application
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          {
            tail -n +2 src/App.tsx
            tail -n +2 src/main.tsx
            tail -n +2 src/index.css
            tail -n +2 package.json
            tail -n +2 vite.config.ts
            tail -n +2 .github/workflows/deploy-pages.yml
          } | tr -d '\n\r' > /tmp/PlantMind.b64

          base64 --decode /tmp/PlantMind.b64 > /tmp/PlantMind.zip
          unzip -t /tmp/PlantMind.zip

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/PlantMind.zip -d .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import modular PlantMind application [skip ci]"
          git push origin main
